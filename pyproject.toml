[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "recommendation-decision-lab"
version = "0.1.0"
description = "Guarded recommendation evaluation and local serving demonstrator"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Ahnaf An Nafee" }]
keywords = [
  "recommender systems",
  "offline evaluation",
  "temporal split",
  "reproducibility",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ahnafnafee/recommendation-decision-lab"
Repository = "https://github.com/ahnafnafee/recommendation-decision-lab"
Issues = "https://github.com/ahnafnafee/recommendation-decision-lab/issues"
Changelog = "https://github.com/ahnafnafee/recommendation-decision-lab/blob/master/CHANGELOG.md"

[project.optional-dependencies]
neural = ["torch>=2.11,<3", "numpy>=2,<3"]
language = ["sentence-transformers>=6,<7", "numpy>=2,<3"]

[tool.setuptools.packages.find]
include = ["reliability*"]
